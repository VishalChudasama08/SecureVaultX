info:
  name: 07 - Get Vault File Metadata
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/vault/files/PASTE_FILE_ID_HERE"

docs: >
  Replace PASTE_FILE_ID_HERE with an id returned by "06 - List Vault
  Files" or by the Store request. 404 for an id you don't own (identical
  to a genuinely unknown id — no information leak).

settings:
  encodeUrl: true
