info:
  name: 01 - Get CSRF Token
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/auth/csrf"

docs: >
  Call this first. Copy the returned "token" value and paste it into the
  X-CSRF-TOKEN header of every POST/DELETE request below (Login, Register,
  Logout, vault uploads/deletes). The session cookie set by Bruno is reused
  automatically by later requests in this collection when "Save cookies"
  is enabled for the environment.

settings:
  encodeUrl: true
