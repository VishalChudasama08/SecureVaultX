# Test profile: in-memory H2 in MySQL mode runs the same Flyway migrations as production (no Docker needed).
spring.datasource.url=jdbc:h2:mem:svxtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# TEST-ONLY key, worthless outside the test suite.
securevaultx.crypto.master-key=dGVzdC1tYXN0ZXIta2V5LTAxMjM0NTY3ODlhYmNkZWY=
securevaultx.crypto.key-id=k-test
securevaultx.storage.root=${java.io.tmpdir}/securevaultx-test-${random.uuid}
securevaultx.storage.max-vault-file-size=5MB
securevaultx.storage.max-upload-size=64MB
securevaultx.cors.allowed-origins=
