spring.application.name=securevaultx-spring-boot

# ---- Database (values come from the environment; see ../.env.example) -------------------------
spring.datasource.url=${SECUREVAULTX_DB_URL:jdbc:mysql://localhost:3306/securevaultx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SECUREVAULTX_DB_USER:root}
spring.datasource.password=${SECUREVAULTX_DB_PASSWORD:}

# Flyway owns the schema. Hibernate never changes it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Cryptography -------------------------------------------------------------------------------
# REQUIRED. Base64 of 32 random bytes. The app refuses to start without it. Never commit it.
securevaultx.crypto.master-key=${SECUREVAULTX_MASTER_KEY:}
securevaultx.crypto.key-id=${SECUREVAULTX_MASTER_KEY_ID:k1}

# ---- Storage policy -------------------------------------------------------------------------------
securevaultx.storage.root=${SECUREVAULTX_STORAGE_ROOT:./data}
# Product policy: largest file that may be kept in the server vault (NOT an AES limit).
securevaultx.storage.max-vault-file-size=${SECUREVAULTX_MAX_VAULT_FILE_SIZE:5MB}
# Operational safety limit for any single upload (Encrypt & Download works up to this size).
securevaultx.storage.max-upload-size=${SECUREVAULTX_MAX_UPLOAD_SIZE:2GB}

# ---- CORS (only needed for browser-based clients; native Flutter apps ignore CORS) ------------------
# Comma-separated exact origins, e.g. http://localhost:5000. Empty = CORS disabled.
securevaultx.cors.allowed-origins=${SECUREVAULTX_CORS_ORIGINS:}

# ---- Session cookie ------------------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SECUREVAULTX_COOKIE_SECURE=true when served over HTTPS (always in production).
server.servlet.session.cookie.secure=${SECUREVAULTX_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Error responses must never leak internals.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=true

server.port=${SECUREVAULTX_PORT:8080}
logging.level.com.securevaultx=INFO
